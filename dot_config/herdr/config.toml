onboarding = false

[ui]
# Start out of the way; prefix+b expands. Takes effect on next launch.
sidebar_start_collapsed = true
# Narrow rail keeps agent state indicators visible while collapsed.
sidebar_collapsed_mode = "compact"

# When expanded, stay tight - space names here are short.
sidebar_width = 20
sidebar_min_width = 16
sidebar_max_width = 24

# Flat attention queue instead of grouping agents under their space.
agent_panel_sort = "priority"

# Distinct glyphs per state instead of same-shape colored dots.
status_indicators = "symbols"
# Reclaim the tab row in single-tab spaces.
hide_tab_bar_when_single_tab = true
show_ide_tab_bar_when_single_tab = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "branch"]]

[ui.sidebar.agents]
# No space grouping now, so each agent row carries its own workspace.
rows = [["state_icon", "workspace", "tab", "agent"]]

[ui.sidebar.agents.rows_by_agent]
# Claude panes report what they are doing via the terminal title;
# give it its own line so it stays readable inside the width cap.
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "off"
